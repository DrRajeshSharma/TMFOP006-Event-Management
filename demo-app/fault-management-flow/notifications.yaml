# Notifications for the fault-management flow, except TMFC043 (declared in ../tmfc043/component.yaml)
# and the trap receiver (declared by its own chart). Topics and apiTypes come only from createflowupdated.png.
# All agents and the digital twin are built and owned by NetoAI, not Jio. These objects only stand in
# for their Components until NetoAI registers its own. NetoAI agents are direct Kafka clients, so every
# subscriber uses transport: native (no adapter pod). apiType is kept as drawn in the diagram.
