{{- if .Values.tls.kafkaCa }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.kafkaCaSecret }}
type: Opaque
stringData:
  ca.crt: |
{{ .Values.tls.kafkaCa | indent 4 }}
---
{{- end }}
{{- if .Values.tls.keycloakCa }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.keycloakCaSecret }}
type: Opaque
stringData:
  ca.crt: |
{{ .Values.tls.keycloakCa | indent 4 }}
{{- end }}
