apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    oda.tmforum.org/componentName: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        oda.tmforum.org/componentName: {{ .Release.Name }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: tmfc043
          image: {{ include "tmfc043.image" . }}
          imagePullPolicy: {{ include "tmfc043.imagePullPolicy" . }}
          env:
            - {name: LOGGING, value: {{ .Values.loglevel | quote }}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: {{ .Values.kafka.bootstrapServers | quote }}}
            - {name: KAFKA_SECURITY_PROTOCOL, value: {{ .Values.kafka.securityProtocol | quote }}}
            - {name: KAFKA_SSL_CAFILE, value: /certs/kafka/ca.crt}
            - {name: KEYCLOAK_CA_FILE, value: /certs/keycloak/ca.crt}
            - {name: KEYCLOAK_TOKEN_URL, value: {{ .Values.keycloak.tokenUrl | quote }}}
            - {name: CONSUMER_GROUP_PREFIX, value: "oda-{{ .Release.Name }}-{{ .Release.Name }}-"}
            - {name: TWIN_BASE_URL, value: {{ .Values.twin.baseUrl | quote }}}
            - {name: TWIN_TIMEOUT_SECONDS, value: {{ .Values.twin.timeoutSeconds | quote }}}
            - {name: TOPIC_IN_ALARM_DETECTED, value: {{ .Values.topics.alarmDetected | quote }}}
            - {name: TOPIC_IN_ALARM_CLEARED, value: {{ .Values.topics.alarmCleared | quote }}}
            - {name: TOPIC_IN_PROBLEM_CREATE, value: {{ .Values.topics.problemCreateIn | quote }}}
            - {name: TOPIC_IN_PROBLEM_STATE, value: {{ .Values.topics.problemStateIn | quote }}}
            - {name: TOPIC_OUT_CREATE_ALARM, value: {{ .Values.topics.createAlarmOut | quote }}}
            - {name: TOPIC_OUT_CLEAR_ALARM, value: {{ .Values.topics.clearAlarmOut | quote }}}
            - {name: TOPIC_OUT_PROBLEM_CREATE, value: {{ .Values.topics.problemCreateOut | quote }}}
            - {name: TOPIC_OUT_PROBLEM_STATE, value: {{ .Values.topics.problemStateOut | quote }}}
            - name: KAFKA_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.keycloak.clientSecret }}, key: client_id}
            - name: KAFKA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.keycloak.clientSecret }}, key: client_secret}
          ports:
            - {name: http, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: kafka-ca, mountPath: /certs/kafka, readOnly: true}
            - {name: keycloak-ca, mountPath: /certs/keycloak, readOnly: true}
      volumes:
        - name: kafka-ca
          secret: {secretName: {{ .Values.tls.kafkaCaSecret }}}
        - name: keycloak-ca
          secret: {secretName: {{ .Values.tls.keycloakCaSecret }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http}
