apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.operator.namespace }}
spec:
  replicas: {{ .Values.operator.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-account
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: eventmanagement-operator
          image: {{ include "eventmanagement-operator.image" . }}
          imagePullPolicy: {{ include "eventmanagement-operator.imagePullPolicy" . }}
          command: ["/bin/sh"]
          args:
            - -c
            - "kopf run $COMPONENT_NAMESPACES_CLI --liveness=http://0.0.0.0:8080/healthz --verbose /src/eventManagementOperator.py"
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.kafka.existingSecretName }}
            - secretRef:
                name: {{ .Values.kafka.existingSecretName }}
                optional: true
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
